openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Contact Database API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: contacts
    description: Contact operations
  - name: companies
    description: Company operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      summary: List contacts with filters
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: jobTitle
          in: query
          schema:
            type: string
        - name: department
          in: query
          schema:
            type: string
        - name: seniority
          in: query
          schema:
            type: string
        - name: industry
          in: query
          schema:
            type: string
        - name: companySize
          in: query
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
        - name: country
          in: query
          schema:
            type: string
        - name: companyId
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of contacts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactListResponse"

  /contacts/{id}:
    get:
      operationId: getContact
      tags: [contacts]
      summary: Get a contact by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Contact detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /contacts/{id}/insights:
    get:
      operationId: getContactInsights
      tags: [contacts]
      summary: Get personal insights for a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContactInsight"

  /contacts/{id}/industry-insights:
    get:
      operationId: getContactIndustryInsights
      tags: [contacts]
      summary: Get industry insights for a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of industry insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IndustryInsight"

  /contacts/{id}/role-insights:
    get:
      operationId: getContactRoleInsights
      tags: [contacts]
      summary: Get role insights for a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of role insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleInsight"

  /contacts/{id}/colleague-insights:
    get:
      operationId: getContactColleagueInsights
      tags: [contacts]
      summary: Get colleague insights for a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of colleague insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ColleagueInsight"

  /contacts/{id}/counterpart-insights:
    get:
      operationId: getContactCounterpartInsights
      tags: [contacts]
      summary: Get counterpart insights for a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of counterpart insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CounterpartInsight"

  /companies:
    get:
      operationId: listCompanies
      tags: [companies]
      summary: List companies with filters
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: industry
          in: query
          schema:
            type: string
        - name: size
          in: query
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
        - name: country
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of companies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyListResponse"

  /companies/{id}/insights:
    get:
      operationId: getCompanyInsights
      tags: [companies]
      summary: Get insights for a company
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of company insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanyInsight"

  /companies/{id}:
    get:
      operationId: getCompany
      tags: [companies]
      summary: Get a company by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Company detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /filters/options:
    get:
      operationId: getFilterOptions
      tags: [contacts]
      summary: Get available filter option values
      responses:
        "200":
          description: Filter options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilterOptions"

  /contacts/{id}/outreach-jobs:
    get:
      operationId: listOutreachJobs
      tags: [contacts]
      summary: List outreach jobs for a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of outreach jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OutreachJob"
    post:
      operationId: createOutreachJob
      tags: [contacts]
      summary: Create an outreach generation job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOutreachJobRequest"
      responses:
        "201":
          description: Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachJob"

  /outreach-jobs/{jobId}:
    get:
      operationId: getOutreachJob
      tags: [contacts]
      summary: Get a single outreach job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Outreach job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachJob"
    patch:
      operationId: updateOutreachJob
      tags: [contacts]
      summary: Rename an outreach job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOutreachJobRequest"
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachJob"
    delete:
      operationId: deleteOutreachJob
      tags: [contacts]
      summary: Delete an outreach job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ContactInsight:
      type: object
      properties:
        id:
          type: integer
        contactId:
          type: integer
        title:
          type: string
        url:
          type: string
        source:
          type: string
        mediaType:
          type: string
        description:
          type: string
          nullable: true
        publishedDate:
          type: string
          nullable: true
      required:
        - id
        - contactId
        - title
        - url
        - source
        - mediaType

    IndustryInsight:
      type: object
      properties:
        id:
          type: integer
        contactId:
          type: integer
        title:
          type: string
        url:
          type: string
        source:
          type: string
        mediaType:
          type: string
        description:
          type: string
          nullable: true
        publishedDate:
          type: string
          nullable: true
      required:
        - id
        - contactId
        - title
        - url
        - source
        - mediaType

    RoleInsight:
      type: object
      properties:
        id:
          type: integer
        contactId:
          type: integer
        title:
          type: string
        url:
          type: string
        source:
          type: string
        mediaType:
          type: string
        description:
          type: string
          nullable: true
        publishedDate:
          type: string
          nullable: true
      required:
        - id
        - contactId
        - title
        - url
        - source
        - mediaType

    ColleagueInsight:
      type: object
      properties:
        id:
          type: integer
        contactId:
          type: integer
        title:
          type: string
        url:
          type: string
        source:
          type: string
        mediaType:
          type: string
        description:
          type: string
          nullable: true
        publishedDate:
          type: string
          nullable: true
      required:
        - id
        - contactId
        - title
        - url
        - source
        - mediaType

    CounterpartInsight:
      type: object
      properties:
        id:
          type: integer
        contactId:
          type: integer
        title:
          type: string
        url:
          type: string
        source:
          type: string
        mediaType:
          type: string
        description:
          type: string
          nullable: true
        publishedDate:
          type: string
          nullable: true
      required:
        - id
        - contactId
        - title
        - url
        - source
        - mediaType

    CompanyInsight:
      type: object
      properties:
        id:
          type: integer
        companyId:
          type: integer
        title:
          type: string
        url:
          type: string
        source:
          type: string
        mediaType:
          type: string
        description:
          type: string
          nullable: true
        publishedDate:
          type: string
          nullable: true
      required:
        - id
        - companyId
        - title
        - url
        - source
        - mediaType

    ContactSummary:
      type: object
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        jobTitle:
          type: string
        department:
          type: string
        seniority:
          type: string
        email:
          type: string
        phone:
          type: string
        location:
          type: string
        country:
          type: string
        linkedinUrl:
          type: string
        companyId:
          type: integer
        companyName:
          type: string
        companyIndustry:
          type: string
        companySize:
          type: string
        insightCount:
          type: integer
      required:
        - id
        - firstName
        - lastName

    ContactDetail:
      type: object
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        jobTitle:
          type: string
        department:
          type: string
        seniority:
          type: string
        email:
          type: string
        phone:
          type: string
        location:
          type: string
        country:
          type: string
        linkedinUrl:
          type: string
        twitterHandle:
          type: string
        bio:
          type: string
        company:
          $ref: "#/components/schemas/CompanySummary"
      required:
        - id
        - firstName
        - lastName

    CompanySummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        industry:
          type: string
        size:
          type: string
        location:
          type: string
        country:
          type: string
        website:
          type: string
        description:
          type: string
        employeeCount:
          type: integer
        foundedYear:
          type: integer
      required:
        - id
        - name

    CompanySummaryWithInsights:
      allOf:
        - $ref: "#/components/schemas/CompanySummary"
        - type: object
          properties:
            insightCount:
              type: integer

    CompanyDetail:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        industry:
          type: string
        size:
          type: string
        location:
          type: string
        country:
          type: string
        website:
          type: string
        description:
          type: string
        employeeCount:
          type: integer
        foundedYear:
          type: integer
        linkedinUrl:
          type: string
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/ContactSummary"
      required:
        - id
        - name

    ContactListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ContactSummary"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
      required:
        - data
        - total
        - page
        - limit
        - totalPages

    CompanyListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CompanySummaryWithInsights"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
      required:
        - data
        - total
        - page
        - limit
        - totalPages

    FilterOptions:
      type: object
      properties:
        industries:
          type: array
          items:
            type: string
        departments:
          type: array
          items:
            type: string
        seniorities:
          type: array
          items:
            type: string
        companySizes:
          type: array
          items:
            type: string
        countries:
          type: array
          items:
            type: string
        locations:
          type: array
          items:
            type: string
      required:
        - industries
        - departments
        - seniorities
        - companySizes
        - countries
        - locations

    OutreachJobParams:
      type: object
      properties:
        length:
          type: string
        tone:
          type: string
        selectedInsightKeys:
          type: array
          items:
            type: string
      required:
        - length
        - tone
        - selectedInsightKeys

    OutreachJob:
      type: object
      properties:
        id:
          type: integer
        contactId:
          type: integer
        type:
          type: string
        status:
          type: string
        title:
          type: string
        params:
          $ref: "#/components/schemas/OutreachJobParams"
        result:
          type: string
          nullable: true
        prompt:
          type: string
          nullable: true
        sources:
          type: array
          nullable: true
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - contactId
        - type
        - status
        - title
        - params
        - createdAt
        - updatedAt

    CreateOutreachJobRequest:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        params:
          $ref: "#/components/schemas/OutreachJobParams"
      required:
        - type
        - title
        - params

    UpdateOutreachJobRequest:
      type: object
      properties:
        title:
          type: string
      required:
        - title
