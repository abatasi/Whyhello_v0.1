openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Contact Database API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: contacts
    description: Contact operations
  - name: companies
    description: Company operations
  - name: hq
    description: HQ profile operations
  - name: imports
    description: CSV data imports and their processing history

paths:
  /contacts/{contactId}/departments:
    parameters:
      - name: contactId
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getContactDepartments
      tags: [contacts]
      summary: Retrieve normalized classifications, original values and review status
      responses:
        "200":
          description: Department classification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactDepartmentClassification" }
        "404": { description: Contact not found }
    put:
      operationId: updateContactDepartments
      tags: [contacts]
      summary: Validate and save department, function and specialization assignments
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactDepartmentClassification" }
      responses:
        "200":
          description: Saved classification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactDepartmentClassification" }
        "400": { description: Invalid hierarchy or classification }
        "404": { description: Contact not found }
  /department-taxonomy:
    get:
      operationId: getDepartmentTaxonomy
      tags: [contacts]
      summary: Retrieve the reusable department and job function hierarchy
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: parentId, in: query, schema: { type: string } }
        - { name: id, in: query, schema: { type: string } }
        - { name: descendants, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Flat normalized nodes with stable identifiers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DepartmentTaxonomyNode"
  /bulk-upload/jobs:
    get:
      operationId: getBulkUploadJobs
      tags: [imports]
      summary: List the current user's CSV import jobs
      responses:
        "200":
          description: Recent import jobs, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBulkImportJobsResponse"
        "401":
          description: Authentication required
  /contacts/{contactId}/insights/indexing-status:
    get:
      operationId: getContactIndexingStatus
      tags: [contacts]
      description: Account-owned successful quote and score indexing is reused for seven days unless HQ changes. Empty successful results are indexed too.
      parameters:
        - in: path
          name: contactId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Whether quote extraction or scoring needs refreshing.
          content:
            application/json:
              schema:
                type: object
                required: [quotesNeedRefresh, scoresNeedRefresh, quotesIndexedAt, scoresIndexedAt, hqRevision]
                properties:
                  quotesNeedRefresh: { type: boolean }
                  scoresNeedRefresh: { type: boolean }
                  quotesIndexedAt: { type: ["string", "null"], format: date-time }
                  scoresIndexedAt: { type: ["string", "null"], format: date-time }
                  hqRevision: { type: string }
        "401":
          description: Authentication required.
        "404":
          description: Contact not found.
  /contacts/{id}/chat:
    post:
      operationId: generateContactChat
      tags: [contacts]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactChatInput" }
      responses:
        "200":
          description: SSE content chunks, attributable sources, and completion event; chosen voice changes style only.
          content:
            text/event-stream:
              schema: { type: string }
        "400": { description: Invalid input or unavailable user-owned voice persona }
        "401": { description: Authentication required }
        "404": { description: Contact not found }
  /playbooks/{id}/sample-contacts/{companyId}:
    get:
      operationId: getPlaybookSampleContacts
      tags: [playbooks]
      summary: List sample company contacts matched against the owner's selected Buying Center
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: companyId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Sample candidates only; does not assign or enroll outreach recipients
          content:
            application/json:
              schema:
                type: object
                required: [contacts, criteriaName]
                properties:
                  criteriaName: { type: string, nullable: true }
                  contacts:
                    type: array
                    items:
                      type: object
                      required: [id, companyId, firstName, lastName, jobTitle, matchingSeats]
                      properties:
                        id: { type: integer }
                        companyId: { type: integer, nullable: true }
                        firstName: { type: string }
                        lastName: { type: string }
                        jobTitle: { type: string, nullable: true }
                        matchingSeats: { type: array, items: { type: string } }
        "400": { description: Invalid playbook or company ID }
        "401": { description: Authentication required }
        "404": { description: Owned playbook or company not found }
  /playbooks/{id}/phone-call/audio:
    post:
      operationId: generatePhoneCallAudio
      tags: [playbooks]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhoneCallAudioInput" }
      responses:
        "200":
          description: Transient AI-spoken rehearsal of the supplied current script; never places a call
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
        "400": { description: Script must contain 1 to 6000 characters }
        "401": { description: Authentication required }
        "404": { description: Owned Playbook not found }
        "502": { description: Audio generation unavailable or failed }
  /playbooks/{id}/manual-email/context:
    get:
      operationId: getManualEmailEditorContext
      tags: [playbooks]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: User-owned HQ, actual contacts, mailboxes, and saved templates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualEmailEditorContext" }
        "401": { description: Authentication required }
        "404": { description: Playbook not found }
  /playbooks/{id}/manual-email/preview:
    post:
      operationId: generateManualEmailPreview
      tags: [playbooks]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualEmailPreviewInput" }
      responses:
        "200":
          description: Read-only real-contact preview with attributable research
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualEmailPreview" }
        "400": { description: Invalid variant or unavailable template fields }
        "401": { description: Authentication required }
        "404": { description: Contact or Playbook not found }
        "502": { description: Generation failed without changing saved content }
  /playbooks/{id}/manual-email/test:
    post:
      operationId: sendManualEmailPreviewTest
      tags: [playbooks]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualEmailTestInput" }
      responses:
        "200":
          description: Current preview sent only to the signed-in user
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean }
        "400": { description: Missing preview or unsupported mailbox provider }
        "401": { description: Authentication or mailbox reauthorization required }
        "409": { description: User mailbox or recipient identity unavailable }
        "502": { description: Mail provider send failed }
  /playbooks/{id}/phone-call/preview:
    post:
      operationId: generatePhoneCallPreview
      tags: [Playbooks]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhoneCallPreviewInput" }
      responses:
        "200":
          description: Seller-reviewed call script; never initiates dialing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhoneCallPreview" }
        "400": { description: Invalid configuration or unavailable template field }
        "401": { description: Authentication required }
        "404": { description: Owned Playbook or preview contact not found }
        "502": { description: Generation failed or evidence could not be verified }
  /playbooks/{id}/linkedin-connection/preview:
    post:
      operationId: generateLinkedInConnectionPreview
      tags: [Playbooks]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LinkedInConnectionPreviewInput" }
      responses:
        "200":
          description: Personalized connection note of at most 200 characters; never sends a request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkedInConnectionPreview" }
        "400": { description: "Invalid configuration, unknown merge field, or resolved template above 200 characters" }
        "401": { description: Authentication required }
        "404": { description: Owned Playbook or contact not found }
        "502": { description: "AI output failed generation, grounding, or length validation" }
  /playbooks/propose:
    post:
      operationId: proposePlaybook
      tags: [playbooks]
      summary: Propose a draft playbook structure for review without saving or activating it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybookProposalInput"
      responses:
        "200":
          description: Proposed workflow for explicit user review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybookProposal"
        "400":
          description: Invalid workflow requirements
        "401":
          description: Authentication required
        "502":
          description: Unable to generate a valid proposal
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /credits/enrichment-preview:
    post:
      operationId: previewEnrichment
      tags: [credits]
      summary: Preview credit usage for selected records without revealing them
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrichmentPreviewInput"
      responses:
        "200":
          description: Enrichment credit estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrichmentPreview"

  /hq/profile/audiences:
    post:
      operationId: createHqAudience
      tags: [hq]
      summary: Create a Buying Center or Target Market without replacing the current HQ profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HqAudienceInput"
      responses:
        "201":
          description: Audience created and appended to the current user's HQ profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HqAudienceResponse"
        "400":
          description: Invalid audience configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Audience ID already exists for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Stored profile is invalid or the request could not be completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /credits/enrich:
    post:
      operationId: enrichRecords
      tags: [credits]
      summary: Confirm enrichment and spend credits on new reveals
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrichmentPreviewInput"
      responses:
        "200":
          description: Selected records enriched atomically
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrichmentResult"
        "402":
          description: Insufficient credits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A selected record is no longer available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      summary: List contacts with filters
      parameters:
        - name: lookalikeContactId
          in: query
          description: Reference contact for existing-contact similarity ranking; excludes the reference and combines with other filters.
          schema:
            type: integer
            minimum: 1
        - name: segment
          in: query
          schema:
            type: string
            enum: [all, netNew, enriched]
        - name: search
          in: query
          schema:
            type: string
        - name: jobTitle
          in: query
          schema:
            type: string
        - name: department
          in: query
          description: Matches the assigned Role name, or the legacy department for contacts without a Role.
          schema:
            type: string
        - name: seniority
          in: query
          schema:
            type: string
        - name: industry
          in: query
          schema:
            type: string
        - name: companySize
          in: query
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
        - name: excludedLocation
          in: query
          schema:
            type: string
        - name: headOfficeLocation
          in: query
          schema:
            type: string
        - name: excludedHeadOfficeLocation
          in: query
          schema:
            type: string
        - name: country
          in: query
          schema:
            type: string
        - name: companyId
          in: query
          schema:
            type: integer
        - name: listId
          in: query
          schema:
            type: integer
        - name: sortBy
          in: query
          schema:
            type: string
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of contacts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactListResponse"

  /contacts/{id}:
    get:
      operationId: getContact
      tags: [contacts]
      summary: Get a contact by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Contact detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /contacts/{id}/insights:
    get:
      operationId: getContactInsights
      tags: [contacts]
      summary: Get personal insights for a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContactInsight"

  /contacts/{id}/industry-insights:
    get:
      operationId: getContactIndustryInsights
      tags: [contacts]
      summary: Get industry insights for a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of industry insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IndustryInsight"

  /contacts/{id}/role-insights:
    get:
      operationId: getContactRoleInsights
      tags: [contacts]
      summary: Get role insights for a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of role insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleInsight"

  /contacts/{id}/colleague-insights:
    get:
      operationId: getContactColleagueInsights
      tags: [contacts]
      summary: Get colleague insights for a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of colleague insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ColleagueInsight"

  /contacts/{id}/counterpart-insights:
    get:
      operationId: getContactCounterpartInsights
      tags: [contacts]
      summary: Get counterpart insights for a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of counterpart insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CounterpartInsight"

  /companies:
    get:
      operationId: listCompanies
      tags: [companies]
      summary: List companies with filters
      parameters:
        - name: segment
          in: query
          schema:
            type: string
            enum: [all, netNew, enriched]
        - name: search
          in: query
          schema:
            type: string
        - name: industry
          in: query
          schema:
            type: string
        - name: size
          in: query
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
        - name: excludedLocation
          in: query
          schema:
            type: string
        - name: country
          in: query
          schema:
            type: string
        - name: listId
          in: query
          schema:
            type: integer
        - name: sortBy
          in: query
          schema:
            type: string
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of companies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyListResponse"

  /companies/{id}/insights:
    get:
      operationId: getCompanyInsights
      tags: [companies]
      summary: Get insights for a company
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of company insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanyInsight"

  /companies/{id}:
    get:
      operationId: getCompany
      tags: [companies]
      summary: Get a company by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Company detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /filters/locations:
    get:
      operationId: searchLocations
      tags: [Filters]
      summary: Search the city, state and country library
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 150
      responses:
        "200":
          description: Matching location options, up to 60
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LocationOption"

  /filters/options:
    get:
      operationId: getFilterOptions
      tags: [contacts]
      summary: Get available filter option values
      responses:
        "200":
          description: Filter options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilterOptions"

  /contacts/{id}/chat-messages:
    get:
      operationId: listChatMessages
      tags: [contacts]
      summary: List persisted chat messages for a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of chat messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContactChatMessage"
    post:
      operationId: createChatMessage
      tags: [contacts]
      summary: Persist a single chat message for a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChatMessageRequest"
      responses:
        "201":
          description: Message created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactChatMessage"
    delete:
      operationId: clearChatMessages
      tags: [contacts]
      summary: Delete all chat messages for a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Cleared

  /contacts/{id}/outreach-jobs:
    get:
      operationId: listOutreachJobs
      tags: [contacts]
      summary: List outreach jobs for a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of outreach jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OutreachJob"
    post:
      operationId: createOutreachJob
      tags: [contacts]
      summary: Create an outreach generation job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOutreachJobRequest"
      responses:
        "201":
          description: Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachJob"

  /outreach-jobs/{jobId}:
    get:
      operationId: getOutreachJob
      tags: [contacts]
      summary: Get a single outreach job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Outreach job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachJob"
    patch:
      operationId: updateOutreachJob
      tags: [contacts]
      summary: Rename an outreach job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOutreachJobRequest"
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachJob"
    delete:
      operationId: deleteOutreachJob
      tags: [contacts]
      summary: Delete an outreach job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

components:
  schemas:
    ContactDepartmentClassification:
      type: object
      required: [primaryDepartment, primaryFunction, primarySpecialization, secondaryDepartments, secondaryFunctions, secondarySpecializations, classificationConfidence, needsReview, rawValues]
      properties:
        primaryDepartment: { type: [string, "null"] }
        primaryFunction: { type: [string, "null"] }
        primarySpecialization: { type: [string, "null"] }
        secondaryDepartments: { type: array, items: { type: string } }
        secondaryFunctions: { type: array, items: { type: string } }
        secondarySpecializations: { type: array, items: { type: string } }
        classificationConfidence: { type: [number, "null"], minimum: 0, maximum: 1 }
        needsReview: { type: boolean }
        rawValues: { type: array, items: { type: string } }
    DepartmentTaxonomyNode:
      type: object
      required: [id, name, slug, parentId, level, aliases, isActive, sortOrder]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
